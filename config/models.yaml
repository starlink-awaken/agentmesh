# Agent Mesh — 模型编排配置
# 由 model-orchestrator 加载，用于 Provider 初始化和调度策略

# 本地模型
local:
  # Ollama — 自动发现 http://localhost:11434
  ollama:
    enabled: true
    base_url: http://localhost:11434

  # LM Studio — 自动发现 http://localhost:1234
  lm_studio:
    enabled: true
    base_url: http://localhost:1234

  # llama.cpp — 手动注册实例，不配置则自动扫描端口 8080-8000
  llama_cpp:
    enabled: true
    instances:
      # - name: my-model
      #   port: 8080
      #   model_path: /models/llama-3.1-8b.gguf

# 云端模型
cloud:
  openai:
    enabled: false
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  anthropic:
    enabled: false
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1

  openrouter:
    enabled: false
    api_key_env: OPENROUTER_API_KEY

# 模型元数据覆盖 — 用于调度器的成本/延迟感知
# 按模型 ID 前缀匹配（最长匹配优先）
# 本地模型 $0 使用成本，优先级取决于延迟和大小
model_overrides:
  # 轻量模型 (4-5B) — 适合简单问答
  - id_prefix: gemma4:latest
    avg_latency_ms: 4700
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: gemma4:e4b
    avg_latency_ms: 4500
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: gemma4:e2b
    avg_latency_ms: 13000
    cost_per_1k_input: 0
    cost_per_1k_output: 0

  # 中等模型 (8-9B) — 日常开发使用
  - id_prefix: qwen3.5:4b
    avg_latency_ms: 9100
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: qwen3.5-9b
    avg_latency_ms: 12200
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: Qwopus3.5-9B
    avg_latency_ms: 13000
    cost_per_1k_input: 0
    cost_per_1k_output: 0

  # 大模型 (27-35B) — 编码/复杂任务
  - id_prefix: qwen3.6:27b
    avg_latency_ms: 32600
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: qwen3.6:35b
    avg_latency_ms: 28500
    cost_per_1k_input: 0
    cost_per_1k_output: 0

  # llama.cpp 服务
  - id_prefix: llama-cpp
    avg_latency_ms: 10000
    cost_per_1k_input: 0
    cost_per_1k_output: 0

# 调度策略
scheduler:
  default_policy: speed-first           # cost-first | speed-first | capability-first | balanced
  health_check_interval_ms: 30000
  cost_weight: 0.3
  speed_weight: 0.3
  capability_weight: 0.4
