# Agent Mesh — 模型编排配置
# 由 model-orchestrator 加载，用于 Provider 初始化和调度策略

# 本地模型
local:
  # Ollama — 自动发现 http://localhost:11434
  ollama:
    enabled: true
    base_url: http://localhost:11434

  # LM Studio — 自动发现 http://localhost:1234
  lm_studio:
    enabled: true
    base_url: http://localhost:1234

  # llama.cpp — 手动注册实例，不配置则自动扫描端口 8080-8000
  llama_cpp:
    enabled: true
    instances:
      # - name: my-model
      #   port: 8080
      #   model_path: /models/llama-3.1-8b.gguf

# 云端模型
cloud:
  openai:
    enabled: false
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  anthropic:
    enabled: false
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1

  openrouter:
    enabled: false
    api_key_env: OPENROUTER_API_KEY

# 调度策略
scheduler:
  default_policy: balanced           # cost-first | speed-first | capability-first | balanced
  health_check_interval_ms: 30000
  cost_weight: 0.3
  speed_weight: 0.3
  capability_weight: 0.4
