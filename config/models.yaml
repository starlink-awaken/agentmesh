# Agent Mesh — 模型编排配置
# 由 model-orchestrator 加载，用于 Provider 初始化和调度策略

# 本地模型
local:
  # Ollama — 自动发现 http://localhost:11434
  ollama:
    enabled: true
    base_url: http://localhost:11434

  # LM Studio — 自动发现 http://localhost:1234
  lm_studio:
    enabled: true
    base_url: http://localhost:1234

  # llama.cpp — 手动注册实例，不配置则自动扫描端口 8080-8000
  llama_cpp:
    enabled: true
    instances:
      # - name: my-model
      #   port: 8080
      #   model_path: /models/llama-3.1-8b.gguf

# 云端模型（需设置 API Key 环境变量）
# 设置方式: export <API_KEY_ENV>=sk-xxxx
# 如无 API Key 请将 enabled 改为 false
cloud:
  openai:
    enabled: true              # ← 改为 true，需要设置 OPENAI_API_KEY 环境变量
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

  anthropic:
    enabled: true              # ← 改为 true，需要设置 ANTHROPIC_API_KEY 环境变量
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1

  openrouter:
    enabled: true              # ← 改为 true，需要设置 OPENROUTER_API_KEY 环境变量
    api_key_env: OPENROUTER_API_KEY

  deepseek:
    enabled: true
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1

# 模型元数据覆盖 — 用于调度器的成本/延迟感知
# 按模型 ID 前缀匹配（最长匹配优先）
# 本地模型 $0 使用成本，优先级取决于延迟和大小
model_overrides:
  # 轻量模型 — 极快响应
  - id_prefix: gemma4:e4b
    avg_latency_ms: 500
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: gemma4:latest
    avg_latency_ms: 4700
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: gemma4:e2b
    avg_latency_ms: 14000
    cost_per_1k_input: 0
    cost_per_1k_output: 0

  # 中等模型 — 日常使用
  - id_prefix: qwen3.5:4b
    avg_latency_ms: 37500
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: qwen3.5-9b
    avg_latency_ms: 60000
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: Qwopus3.5-9B
    avg_latency_ms: 49700
    cost_per_1k_input: 0
    cost_per_1k_output: 0

  # 大模型 — 复杂任务
  - id_prefix: qwen3.6:35b
    avg_latency_ms: 27000
    cost_per_1k_input: 0
    cost_per_1k_output: 0
  - id_prefix: qwen3.6:27b
    avg_latency_ms: 60000
    cost_per_1k_input: 0
    cost_per_1k_output: 0

  # llama.cpp 服务
  - id_prefix: llama-cpp
    avg_latency_ms: 10000
    cost_per_1k_input: 0
    cost_per_1k_output: 0

# 断路器配置 — Provider 连续失败时自动熔断
circuit_breaker:
  enabled: true
  failure_threshold: 3
  reset_timeout_ms: 30000
  half_open_max_requests: 1

# 重试配置 — 临时错误自动指数退避重试
retry:
  enabled: true
  max_retries: 3
  base_delay_ms: 500
  max_delay_ms: 10000
  retryable_statuses: [429, 500, 502, 503, 504]

# 调度策略
scheduler:
  default_policy: speed-first           # cost-first | speed-first | capability-first | balanced
  health_check_interval_ms: 30000
  cost_weight: 0.3
  speed_weight: 0.3
  capability_weight: 0.4
