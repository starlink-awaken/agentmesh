agents:
- capabilities:
  - code-generation
  - code-review
  - debugging
  - refactoring
  - documentation
  - file-operations
  id: claude-code
  name: Claude Code
  type: claude-code
- capabilities:
  - browser-automation
  - web-scraping
  - form-filling
  - ui-testing
  id: openclaw
  name: OpenClaw
  type: openclaw
dataDir: ./data
host: 0.0.0.0
logDir: ./logs
port: 3000
routing:
  defaultAgent: claude-code
  rules:
  - agent: claude-code
    keywords:
    - write code
    - generate code
    - create function
    - create class
    - 写代码
    - 生成代码
    name: code-generation
    priority: 10
  - agent: claude-code
    keywords:
    - review
    - code review
    - pr review
    - review code
    - 代码审查
    - review code
    name: code-review
    priority: 15
  - agent: claude-code
    keywords:
    - debug
    - fix bug
    - error
    - bug
    - 调试
    - 修复错误
    name: debugging
    priority: 15
  - agent: claude-code
    keywords:
    - refactor
    - 重构
    - improve code
    name: refactoring
    priority: 10
  - agent: claude-code
    keywords:
    - docs
    - document
    - 文档
    - write docs
    name: documentation
    priority: 10
  - agent: openclaw
    keywords:
    - browser
    - scrape
    - click
    - screenshot
    - web automation
    - 浏览器
    - 爬虫
    - 截图
    name: browser-automation
    priority: 15
  - agent: openclaw
    keywords:
    - scrap
    - crawl
    - extract data
    - 抓取
    - 采集
    name: web-scraping
    priority: 15
  - agent: cursor
    keywords:
    - cursor
    - cursor task
    name: cursor-task
    priority: 12
  - agent: windsurf
    keywords:
    - windsurf
    - flow state
    name: windsurf-task
    priority: 12
  - agent: qwen-code
    keywords:
    - qwen
    - 通义千问
    name: qwen-task
    priority: 12
  - agent: gemini
    keywords:
    - gemini
    - multimodal
    - 多模态
    name: gemini-task
    priority: 12
  - agent: droid
    keywords:
    - android
    - apk
    - mobile
    - 安卓
    - 手机应用
    name: android-development
    priority: 15
  - agent: aider
    keywords:
    - aider
    - git edit
    - refactor git
    name: aider-task
    priority: 12
  - agent: cline
    keywords:
    - cline
    - autonomous
    name: cline-task
    priority: 12
  - agent: roo-code
    keywords:
    - roo-code
    - roo
    name: roo-code-task
    priority: 12
  - agents:
    - claude-code
    - openclaw
    keywords:
    - collaborate
    - team
    - together
    - multiple agents
    - 协作
    - 多个
    name: multi-agent
    priority: 20
    strategy: broadcast
wsPort: 3001
