port: 3000
wsPort: 3001
host: "0.0.0.0"
dataDir: "./data"
logDir: "./logs"

routing:
  defaultAgent: "claude-code"

  rules:
    # Claude Code - 通用代码任务
    - name: code-generation
      keywords:
        - write code
        - generate code
        - create function
        - create class
        - 写代码
        - 生成代码
      agent: claude-code
      priority: 10

    - name: code-review
      keywords:
        - review
        - code review
        - pr review
        - review code
        - 代码审查
        - review code
      agent: claude-code
      priority: 15

    - name: debugging
      keywords:
        - debug
        - fix bug
        - error
        - bug
        - 调试
        - 修复错误
      agent: claude-code
      priority: 15

    - name: refactoring
      keywords:
        - refactor
        - 重构
        - improve code
      agent: claude-code
      priority: 10

    - name: documentation
      keywords:
        - docs
        - document
        - 文档
        - write docs
      agent: claude-code
      priority: 10

    # OpenClaw - 浏览器自动化
    - name: browser-automation
      keywords:
        - browser
        - scrape
        - click
        - screenshot
        - web automation
        - 浏览器
        - 爬虫
        - 截图
      agent: openclaw
      priority: 15

    - name: web-scraping
      keywords:
        - scrap
        - crawl
        - extract data
        - 抓取
        - 采集
      agent: openclaw
      priority: 15

    # Cursor - AI 编程
    - name: cursor-task
      keywords:
        - cursor
        - cursor task
      agent: cursor
      priority: 12

    # Windsurf - Flow 状态编程
    - name: windsurf-task
      keywords:
        - windsurf
        - flow state
      agent: windsurf
      priority: 12

    # Qwen Code - 中文编程
    - name: qwen-task
      keywords:
        - qwen
        - 通义千问
      agent: qwen-code
      priority: 12

    # Gemini - 多模态
    - name: gemini-task
      keywords:
        - gemini
        - multimodal
        - 多模态
      agent: gemini
      priority: 12

    # Droid - Android 开发
    - name: android-development
      keywords:
        - android
        - apk
        - mobile
        - 安卓
        - 手机应用
      agent: droid
      priority: 15

    # Aider - Git 集成编辑
    - name: aider-task
      keywords:
        - aider
        - git edit
        - refactor git
      agent: aider
      priority: 12

    # Cline - 自主编程
    - name: cline-task
      keywords:
        - cline
        - autonomous
      agent: cline
      priority: 12

    # Roo Code
    - name: roo-code-task
      keywords:
        - roo-code
        - roo
      agent: roo-code
      priority: 12

    # 多 Agent 协作
    - name: multi-agent
      keywords:
        - collaborate
        - team
        - together
        - multiple agents
        - 协作
        - 多个
      strategy: broadcast
      agents:
        - claude-code
        - openclaw
      priority: 20

# =============================================================================
# 模型网关配置 — 多 Provider 路由 + 配额感知 Fallback
# =============================================================================
models:
  default_model: deepseek-chat

  # 默认配置（各 Provider 可覆盖）
  defaults:
    circuit_breaker:
      failure_threshold: 3
      reset_timeout_ms: 30000
      half_open_max_requests: 1
    retry:
      max_retries: 3
      base_delay_ms: 500
      max_delay_ms: 10000
      retryable_statuses: [429, 500, 502, 503, 504]

  providers:
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      models:
        - deepseek-chat
        - deepseek-reasoner
        - deepseek-v4-pro
        - deepseek-v4-flash
    openai:
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      models:
        - gpt-5.1
        - gpt-5.1-codex
        - o4-mini
    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    ollama:
      base_url: http://127.0.0.1:11434/v1
      api_key: ollama
      models:
        - qwen3:14b
        - codestral:22b
        - llama3.1:8b

  # Fallback 链：主 Provider 不可用时依次尝试
  fallback_chain:
    - deepseek
    - openrouter
    - ollama

  # 模型名 → 优先 Provider 列表
  model_routing:
    "deepseek":
      - deepseek
    "gpt-":
      - openai
      - deepseek
    "o1":
      - openai
      - deepseek
    "o4":
      - openai
      - deepseek
    "claude":
      - openrouter
    "gemini":
      - openrouter
    "qwen":
      - ollama
    "codestral":
      - ollama
    "llama":
      - ollama

# =============================================================================
# Agent 配置
# =============================================================================
agents:
  # 内置 Agent（在代码中注册）
  - id: claude-code
    name: Claude Code
    type: claude-code
    capabilities:
      - code-generation
      - code-review
      - debugging
      - refactoring
      - documentation
      - file-operations

  - id: openclaw
    name: OpenClaw
    type: openclaw
    capabilities:
      - browser-automation
      - web-scraping
      - form-filling
      - ui-testing
