services:
  agentmesh:
    build: .
    container_name: agentmesh
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - agentmesh_cache:/app/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agentmesh_cache:
